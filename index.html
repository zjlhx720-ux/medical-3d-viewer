<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医疗设备3D模型展示</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0d1117;color:#c9d1d9}
  body{display:flex;flex-direction:column}
  header{height:52px;min-height:52px;background:linear-gradient(135deg,#0d1117,#161b22);border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 20px;gap:12px;z-index:10}
  header .logo{font-size:18px;font-weight:700;color:#58a6ff}
  header .subtitle{font-size:12px;color:#8b949e;margin-left:auto}
  main{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:0}
  aside{background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow-y:auto;z-index:5}
  aside .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#8b949e;padding:16px 20px 8px}
  aside .device-btn{display:flex;align-items:center;gap:10px;padding:12px 20px;border:none;background:transparent;color:#c9d1d9;font-size:14px;cursor:pointer;transition:all .2s;text-align:left;width:100%;border-left:3px solid transparent;font-family:inherit}
  aside .device-btn:hover{background:rgba(88,166,255,.05)}
  aside .device-btn.active{background:rgba(31,111,235,.2);border-left-color:#58a6ff;color:#fff;font-weight:600}
  aside .device-btn .icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#1c2333;flex-shrink:0}
  aside .device-btn.active .icon{background:rgba(88,166,255,.2)}
  aside .divider{border-top:1px solid #30363d;margin:8px 0}
  aside .controls-section{padding:12px 20px}
  aside .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px}
  aside .toggle-switch{position:relative;width:40px;height:22px;flex-shrink:0}
  aside .toggle-switch input{opacity:0;width:0;height:0}
  aside .toggle-slider{position:absolute;inset:0;background:#30363d;border-radius:11px;cursor:pointer;transition:background .25s}
  aside .toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .25s}
  aside .toggle-switch input:checked+.toggle-slider{background:#58a6ff}
  aside .toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px)}
  #viewport{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#1a2030 0%,#0d1117 70%)}
  #viewport canvas{display:block}
  #info-panel{position:absolute;bottom:20px;left:20px;max-width:360px;background:rgba(22,27,34,.88);backdrop-filter:blur(12px);border:1px solid #30363d;border-radius:10px;padding:16px 20px;pointer-events:none;transition:opacity .35s}
  #info-panel .device-name{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
  #info-panel .device-desc{font-size:13px;color:#8b949e;line-height:1.6}
  #info-panel .device-usage{margin-top:8px;font-size:12px;color:#58a6ff}
  #info-panel .device-usage::before{content:'🏥 '}
  #controls-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(139,148,158,.7);pointer-events:none;text-align:center}
  footer{height:32px;min-height:32px;background:#161b22;border-top:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8b949e;gap:24px}
  @media(max-width:768px){
    main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid #30363d;padding:6px 8px;gap:4px;flex-shrink:0}
    aside .nav-label{display:none}
    aside .device-btn{white-space:nowrap;padding:8px 14px;border-left:none;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;font-size:12px;gap:4px}
    aside .device-btn.active{border-left-color:transparent;border-bottom-color:#58a6ff;border-radius:8px 8px 0 0}
    aside .device-btn .icon{width:20px;height:20px;font-size:12px;border-radius:4px}
    aside .divider,aside .controls-section{display:none}
    #info-panel{bottom:10px;left:10px;right:10px;max-width:none;padding:10px 14px}
    #info-panel .device-name{font-size:15px}
    footer{font-size:10px;gap:12px}
  }
</style>
</head>
<body>

<header>
  <span class="logo">🏥 医疗设备3D模型展示</span>
  <span class="subtitle">Medical Device 3D Viewer</span>
</header>

<main>
  <aside id="sidebar">
    <div class="nav-label">设备列表</div>
    <button class="device-btn active" data-device="pacemaker"><span class="icon">❤️</span>心脏起搏器</button>
    <button class="device-btn" data-device="ct-scanner"><span class="icon">🫁</span>CT扫描仪</button>
    <button class="device-btn" data-device="cori"><span class="icon">🦿</span>CORI手术机器人</button>
    <button class="device-btn" data-device="davinci"><span class="icon">🤖</span>达芬奇手术机器人</button>
    <div class="divider"></div>
    <div class="controls-section">
      <div class="toggle-row"><span>🔄 自动旋转</span><label class="toggle-switch"><input type="checkbox" id="toggle-auto-rotate" checked><span class="toggle-slider"></span></label></div>
      <div class="toggle-row"><span>📐 线框模式</span><label class="toggle-switch"><input type="checkbox" id="toggle-wireframe"><span class="toggle-slider"></span></label></div>
    </div>
  </aside>
  <section id="viewport">
    <div id="info-panel">
      <div class="device-name">心脏起搏器</div>
      <div class="device-desc">心脏起搏器是一种植入体内的电子医疗设备，通过电脉冲调节心跳节律。</div>
      <div class="device-usage">用于治疗心律失常、心动过缓等心脏疾病</div>
    </div>
    <div id="controls-hint">🖱 拖拽旋转 | 滚轮缩放 | 右键平移 | 方向键切换设备</div>
  </section>
</main>

<footer>
  <span>鼠标拖拽旋转</span><span>滚轮缩放</span><span>右键平移</span><span>方向键 ← → 切换设备</span>
</footer>

<script src="three.min.js"></script>
<script>
(function(){
  var hint = document.getElementById('controls-hint');
  if(typeof THREE === 'undefined'){
    hint.textContent = '❌ THREE.js 加载失败';
    hint.style.color = '#f85149';
    hint.style.fontSize = '13px';
    return;
  }
  // Initialize app when DOM ready
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(startApp, 50); });
  } else {
    setTimeout(startApp, 50);
  }

  function startApp(){
    var hint = document.getElementById('controls-hint');
    var viewport = document.getElementById('viewport');
    var infoPanel = document.getElementById('info-panel');

    // ── WebGL Check ──
    var testCanvas = document.createElement('canvas');
    var gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
    if(!gl){
      hint.textContent = '❌ 浏览器不支持 WebGL';
      hint.style.color = '#f85149';
      hint.style.fontSize = '13px';
      return;
    }

    // ── Renderer ──
    var W = viewport.clientWidth, H = viewport.clientHeight;
    var renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(0x0d1117);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    viewport.appendChild(renderer.domElement);

    // ── Scene ──
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0d1117, 5, 25);

    // ── Camera ──
    var camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
    camera.position.set(3.5, 2.2, 6.5);

    // ── Lights ──
    scene.add(new THREE.AmbientLight(0x334466, 1.8));
    scene.add(new THREE.HemisphereLight(0x8899cc, 0x223344, 1.0));
    var keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
    keyLight.position.set(6, 10, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 50;
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.bias = -0.0001;
    scene.add(keyLight);
    var fillLight = new THREE.DirectionalLight(0x8899cc, 1.2);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);
    var rimLight = new THREE.DirectionalLight(0xaaccff, 2.0);
    rimLight.position.set(0, -0.5, 5);
    scene.add(rimLight);

    // ── Ground ──
    var groundGeo = new THREE.CircleGeometry(5, 64);
    var groundMat = new THREE.MeshStandardMaterial({color:0x1a2030, roughness:0.7, metalness:0.1});
    var ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -2.6;
    ground.receiveShadow = true;
    ground.renderOrder = 1;
    scene.add(ground);

    // ── Grid ring ──
    var ringGeo = new THREE.TorusGeometry(4.5, 0.01, 8, 80);
    var ringMat = new THREE.MeshBasicMaterial({color:0x30363d, transparent:true, opacity:0.5});
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2;
    ring.position.y = -2.59;
    scene.add(ring);

    // ── Model Holder ──
    var modelHolder = new THREE.Group();
    scene.add(modelHolder);

    // ── Orbit Controls (simple inline) ──
    var target = new THREE.Vector3(0, 0.2, 0);
    var spherical = new THREE.Spherical();
    spherical.setFromVector3(new THREE.Vector3().copy(camera.position).sub(target));
    var isDragging = false, prevX = 0, prevY = 0;
    var autoRotate = true;

    viewport.addEventListener('pointerdown', function(e){
      isDragging = true; prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener('pointermove', function(e){
      if(!isDragging) return;
      var dx = e.clientX - prevX;
      var dy = e.clientY - prevY;
      spherical.theta -= dx * 0.005;
      spherical.phi -= dy * 0.005;
      spherical.phi = Math.max(0.05, Math.min(Math.PI*0.7, spherical.phi));
      prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener('pointerup', function(){ isDragging = false; });
    viewport.addEventListener('wheel', function(e){
      e.preventDefault();
      spherical.radius *= e.deltaY > 0 ? 1.08 : 0.92;
      spherical.radius = Math.max(2.5, Math.min(12, spherical.radius));
    }, {passive:false});
    viewport.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    viewport.style.touchAction = 'none';

    // ── Helpers ──
    function createMesh(geo, mat){
      var m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    function createTubeCurve(points, radius, tubularSegments, radialSegments){
      radius = radius || 0.04;
      tubularSegments = tubularSegments || 80;
      radialSegments = radialSegments || 16;
      var curve = new THREE.CatmullRomCurve3(points.map(function(p){ return new THREE.Vector3(p[0],p[1],p[2]); }));
      return new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
    }

    function M(color, roughness, metalness){
      return new THREE.MeshStandardMaterial({color:color, roughness:roughness||0.2, metalness:metalness||0.85});
    }

    function P(color, roughness, metalness){
      return new THREE.MeshStandardMaterial({color:color, roughness:roughness||0.4, metalness:metalness||0.05});
    }

    // ── MODEL: Pacemaker (心脏起搏器) ──
    function createPacemaker(){
      var g = new THREE.Group();
      var Ti = M(0xc0c0c0,0.15,0.7); // Titanium can material
      var TiDark = M(0x909090,0.1,0.8);
      var Epoxy = new THREE.MeshStandardMaterial({color:0xf5f5f5,roughness:0.08,metalness:0.05,opacity:0.78,transparent:true,depthWrite:true});
      var LeadMat = new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.4,metalness:0.1});

      // Main titanium can - rounded by using chamfered box illusion
      var can = createMesh(new THREE.BoxGeometry(0.75,0.42,0.95,6,4,6), Ti);
      g.add(can);
      // Can edge bevel simulation - thin plates on edges
      [-0.375,0.375].forEach(function(x){
        var edge = createMesh(new THREE.BoxGeometry(0.04,0.38,0.91), TiDark);
        edge.position.set(x,0,0); g.add(edge);
      });
      [-0.475,0.475].forEach(function(z){
        var edge2 = createMesh(new THREE.BoxGeometry(0.71,0.38,0.04), TiDark);
        edge2.position.set(0,0,z); g.add(edge2);
      });

      // Can top rim
      var rim = createMesh(new THREE.BoxGeometry(0.77,0.06,0.97), TiDark);
      rim.position.y = 0.22; g.add(rim);

      // Epoxy header block - with proper shape
      var headerBase = createMesh(new THREE.BoxGeometry(0.58,0.26,0.28,4,3,3), Epoxy);
      headerBase.position.set(0,0.38,0); g.add(headerBase);
      // Header top rounding
      var headerTop = createMesh(new THREE.CylinderGeometry(0.12,0.12,0.28,20), Epoxy);
      headerTop.position.set(0,0.48,0); headerTop.rotation.z = Math.PI/2; g.add(headerTop);

      // IS-1 connector ports (2 ports on header)
      for(var pi=0;pi<2;pi++){
        var zOff = (pi-0.5)*0.18;
        // Port bore
        var bore = createMesh(new THREE.CylinderGeometry(0.045,0.045,0.12,20), M(0x666666,0.05,0.9));
        bore.position.set(0,0.43,zOff); bore.rotation.x = Math.PI/2; g.add(bore);
        // Port ring
        var portRing = createMesh(new THREE.TorusGeometry(0.05,0.015,12,20), M(0xaaaaaa,0.05,0.95));
        portRing.position.set(0.06,0.43,zOff); g.add(portRing);
        // Set screw (tiny)
        var screw = createMesh(new THREE.CylinderGeometry(0.012,0.012,0.03,10), M(0x888888,0.05,0.9));
        screw.position.set(0,0.48,zOff); g.add(screw);
      }

      // Lead wires with IS-1 connector boots
      function makeLead(startX, startY, startZ, pts){
        // Connector boot (thicker part near header)
        var bootGeo = new THREE.CylinderGeometry(0.04,0.055,0.2,16);
        var boot = createMesh(bootGeo, M(0x555555,0.3,0.3));
        boot.position.set(startX+0.1,startY,startZ);
        boot.rotation.z = -Math.PI/2;
        g.add(boot);
        // Flex lead
        var leadPts = [[startX+0.2,startY,startZ]].concat(pts);
        var lead = createMesh(createTubeCurve(leadPts,0.018,80,12), LeadMat);
        g.add(lead);
        // Electrode tip
        var tipPos = pts[pts.length-1];
        var tip = createMesh(new THREE.SphereGeometry(0.035,14,14), M(0xcccccc,0.05,0.95));
        tip.position.set(tipPos[0],tipPos[1],tipPos[2]); g.add(tip);
        // Ring electrode
        var ringEl = createMesh(new THREE.TorusGeometry(0.025,0.008,10,14), M(0xdddddd,0.05,0.95));
        ringEl.position.set(tipPos[0],tipPos[1]-0.04,tipPos[2]); g.add(ringEl);
      }
      makeLead(0,0.43,-0.08,[[0.35,0.15,-0.5],[0.55,-0.3,-1.0],[0.6,-0.8,-1.4]]);
      makeLead(0,0.43,0.08,[[-0.35,0.15,0.5],[-0.55,-0.3,1.0],[-0.6,-0.8,1.4]]);

      // Manufacturer label plate on can
      var label = createMesh(new THREE.PlaneGeometry(0.35,0.12),
        new THREE.MeshStandardMaterial({color:0x333333,roughness:0.5,metalness:0.3,emissive:0x111111,emissiveIntensity:0.3}));
      label.position.set(0,0.002,0.48); g.add(label);

      // Suture holes (small loops on can sides)
      for(var si=0;si<4;si++){
        var angle = si*Math.PI/2;
        var sx = Math.cos(angle)*0.38;
        var sz = Math.sin(angle)*0.48;
        var suture = createMesh(new THREE.TorusGeometry(0.04,0.012,8,12), TiDark);
        suture.position.set(sx,0.2,sz);
        suture.rotation.y = angle;
        g.add(suture);
      }

      return g;
    }

    // ── MODEL: CT Scanner (CT扫描仪) ──
    function createCTScanner(){
      var g = new THREE.Group();
      var White = P(0xf2f2f2,0.25,0.08);
      var Gray = P(0xd0d0d0,0.3,0.15);
      var DarkGray = P(0x888888,0.25,0.2);
      var BlueAccent = new THREE.MeshStandardMaterial({color:0x1976d2,roughness:0.3,metalness:0.1,emissive:0x0a2a4a,emissiveIntensity:0.3});

      // ── Gantry (扫描架) ──
      // Main outer housing
      var outerHousing = createMesh(new THREE.TorusGeometry(1.55,0.52,36,90), White);
      outerHousing.rotation.x = Math.PI/2; g.add(outerHousing);

      // Front bezel ring
      var frontBezel = createMesh(new THREE.TorusGeometry(1.65,0.12,24,90), P(0xe8e8e8,0.2,0.2));
      frontBezel.rotation.x = Math.PI/2; frontBezel.position.z = 0.05; g.add(frontBezel);

      // Rear housing ring
      var rearHousing = createMesh(new THREE.TorusGeometry(1.58,0.15,24,90), P(0xdddddd,0.3,0.1));
      rearHousing.rotation.x = Math.PI/2; rearHousing.position.z = -0.25; g.add(rearHousing);

      // Inner bore ring (where patient goes through)
      var boreRing = createMesh(new THREE.TorusGeometry(1.1,0.08,24,80), P(0xcccccc,0.2,0.25));
      boreRing.rotation.x = Math.PI/2; g.add(boreRing);

      // Blue accent ring inside bore
      var accentRing = createMesh(new THREE.TorusGeometry(1.14,0.03,16,80), BlueAccent);
      accentRing.rotation.x = Math.PI/2; accentRing.position.z = 0.03; g.add(accentRing);

      // Laser positioning lights (small red dots around bore)
      for(var li=0;li<4;li++){
        var la = li*Math.PI/2;
        var laser = createMesh(new THREE.SphereGeometry(0.025,8,8),
          new THREE.MeshStandardMaterial({color:0xff0000,roughness:0.1,emissive:0xff0000,emissiveIntensity:0.8}));
        laser.position.set(Math.cos(la)*1.25,-0.1,Math.sin(la)*1.25+0.03);
        g.add(laser);
      }

      // Gantry side panels - left
      var sidePanelL = createMesh(new THREE.BoxGeometry(0.15,1.0,1.8), White);
      sidePanelL.position.set(-1.55,0.2,0); g.add(sidePanelL);
      // Gantry side panels - right
      var sidePanelR = createMesh(new THREE.BoxGeometry(0.15,1.0,1.8), White);
      sidePanelR.position.set(1.55,0.2,0); g.add(sidePanelR);

      // ── Gantry Stand ──
      var standBase = createMesh(new THREE.BoxGeometry(1.0,0.3,0.9,3,2,3), Gray);
      standBase.position.y = -1.95; g.add(standBase);
      // Stand column
      var standCol = createMesh(new THREE.BoxGeometry(0.55,0.45,0.65,3,3,3), Gray);
      standCol.position.y = -1.6; g.add(standCol);
      // Tilt mechanism housing
      var tiltHousing = createMesh(new THREE.CylinderGeometry(0.25,0.25,0.5,20), DarkGray);
      tiltHousing.position.set(0,-1.35,0); tiltHousing.rotation.x = Math.PI/2; g.add(tiltHousing);

      // ── Patient Table ──
      // Main table board
      var tableBoard = createMesh(new THREE.BoxGeometry(0.6,0.1,4.2,3,2,6), P(0xf8f8f8,0.3,0.05));
      tableBoard.position.set(0,-0.55,0.5); g.add(tableBoard);
      // Table rail left
      var railL = createMesh(new THREE.BoxGeometry(0.04,0.06,4.0), M(0xcccccc,0.15,0.8));
      railL.position.set(-0.32,-0.5,0.5); g.add(railL);
      // Table rail right
      var railR = createMesh(new THREE.BoxGeometry(0.04,0.06,4.0), M(0xcccccc,0.15,0.8));
      railR.position.set(0.32,-0.5,0.5); g.add(railR);
      // Mattress
      var mattress = createMesh(new THREE.BoxGeometry(0.54,0.08,3.9,3,2,6),
        new THREE.MeshStandardMaterial({color:0x4488bb,roughness:0.65,metalness:0}));
      mattress.position.set(0,-0.44,0.48); g.add(mattress);
      // Head rest bump
      var headRest = createMesh(new THREE.BoxGeometry(0.5,0.1,0.4,3,2,3),
        new THREE.MeshStandardMaterial({color:0x5599cc,roughness:0.6,metalness:0}));
      headRest.position.set(0,-0.38,2.45); g.add(headRest);

      // Table support pillar
      var tablePillar = createMesh(new THREE.BoxGeometry(0.35,0.8,0.35,3,3,3), Gray);
      tablePillar.position.set(0,-1.4,2.0); g.add(tablePillar);
      // Table base
      var tableBase = createMesh(new THREE.BoxGeometry(0.55,0.18,0.7,3,2,3), Gray);
      tableBase.position.set(0,-1.78,2.0); g.add(tableBase);

      // ── Control Panel on gantry side ──
      var cpHousing = createMesh(new THREE.BoxGeometry(0.28,0.5,0.22,3,3,3), P(0xe0e0e0,0.25,0.15));
      cpHousing.position.set(1.68,0.15,0.2); g.add(cpHousing);
      // Touch screen
      var cpScreen = createMesh(new THREE.PlaneGeometry(0.2,0.35),
        new THREE.MeshStandardMaterial({color:0x112233,roughness:0.08,emissive:0x081018,emissiveIntensity:0.5}));
      cpScreen.position.set(1.8,0.15,0.2); cpScreen.rotation.y = Math.PI/2; g.add(cpScreen);
      // Control buttons
      for(var bi=0;bi<3;bi++){
        var btn = createMesh(new THREE.CylinderGeometry(0.03,0.03,0.02,12),

    ];

    // ── State ──
    var currentDeviceId = 'pacemaker';
    var isWireframe = false;

    // ── Model Switching ──
    function clearModelHolder(){
      while(modelHolder.children.length > 0){
        var child = modelHolder.children[0];
        modelHolder.remove(child);
        if(child.traverse){
          child.traverse(function(c){
            if(c.geometry) c.geometry.dispose();
            if(c.material){
              if(Array.isArray(c.material)) c.material.forEach(function(m){ m.dispose(); });
              else c.material.dispose();
            }
          });
        }
      }
    }

    function loadModel(deviceId){
      clearModelHolder();
      var device = DEVICES.filter(function(d){ return d.id === deviceId; })[0];
      if(!device) return;
      var model = device.factory();
      modelHolder.add(model);
      currentDeviceId = deviceId;
      if(isWireframe) applyWireframe();
    }

    function switchToDevice(deviceId){
      if(deviceId === currentDeviceId) return;
      loadModel(deviceId);
      updateInfoPanel(deviceId);
      target.set(0, 0.2, 0);
    }

    // ── Info Panel ──
    function updateInfoPanel(deviceId){
      var device = DEVICES.filter(function(d){ return d.id === deviceId; })[0];
      if(!device) return;
      infoPanel.querySelector('.device-name').textContent = device.name;
      infoPanel.querySelector('.device-desc').textContent = device.desc;
      infoPanel.querySelector('.device-usage').textContent = device.usage;
    }

    // ── Wireframe ──
    var origMaterials = [];
    function applyWireframe(){
      modelHolder.traverse(function(child){
        if(!child.isMesh || !child.material) return;
        if(child === ground) return;
        if(isWireframe){
          origMaterials.push({mesh:child, mat:child.material});
          var c = child.material.color ? child.material.color.getHex() : 0x58a6ff;
          child.material = new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:0.8});
        }
      });
    }

    function restoreWireframe(){
      origMaterials.forEach(function(entry){
        entry.mesh.material = entry.mat;
      });
      origMaterials = [];
    }

    function toggleWireframe(on){
      isWireframe = on;
      if(on){ applyWireframe(); }
      else { restoreWireframe(); }
    }

    // ── Sidebar Buttons ──
    var buttons = document.querySelectorAll('.device-btn');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        var deviceId = btn.getAttribute('data-device');
        if(deviceId === currentDeviceId) return;
        buttons.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        switchToDevice(deviceId);
      });
    });

    // ── Toggles ──
    document.getElementById('toggle-auto-rotate').addEventListener('change', function(e){
      autoRotate = e.target.checked;
    });
    document.getElementById('toggle-wireframe').addEventListener('change', function(e){
      toggleWireframe(e.target.checked);
    });

    // ── Keyboard ──
    window.addEventListener('keydown', function(e){
      if(e.target.tagName === 'INPUT') return;
      var idx = -1;
      for(var i=0;i<DEVICES.length;i++){ if(DEVICES[i].id===currentDeviceId){ idx=i; break; } }
      if(e.key==='ArrowRight'||e.key==='ArrowDown') idx = (idx+1)%DEVICES.length;
      else if(e.key==='ArrowLeft'||e.key==='ArrowUp') idx = (idx-1+DEVICES.length)%DEVICES.length;
      else return;
      e.preventDefault();
      buttons.forEach(function(b){ b.classList.remove('active'); });
      buttons[idx].classList.add('active');
      switchToDevice(DEVICES[idx].id);
    });

    // ── Resize ──
    window.addEventListener('resize', function(){
      var w = viewport.clientWidth, h = viewport.clientHeight;
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // ── Init ──
    loadModel('pacemaker');

    // ── Animate ──
    (function animate(){
      requestAnimationFrame(animate);
      if(autoRotate) spherical.theta += 0.003;
      var pos = new THREE.Vector3().setFromSpherical(spherical).add(target);
      camera.position.lerp(pos, 0.1);
      camera.lookAt(target);
      renderer.render(scene, camera);
    })();

    hint.textContent = '🖱 拖拽旋转 | 滚轮缩放 | 右键平移 | 方向键切换设备';
    hint.style.color = 'rgba(139,148,158,0.7)';
    hint.style.fontSize = '11px';
  }
})();
</script>

</body>
</html>
